replicaCount: 1

image:
  repository: ghcr.io/your-username/youtube-converter
  pullPolicy: IfNotPresent
  tag: ""  # defaults to Chart.appVersion

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: youtube-converter.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: youtube-converter-tls
  #    hosts:
  #      - youtube-converter.example.com

persistence:
  enabled: true
  storageClass: ""   # leave empty to use cluster default
  accessMode: ReadWriteOnce
  size: 1Gi

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi

# Increase if you expect concurrent conversions
# (each conversion is CPU/memory-heavy)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # yt-dlp writes temp files
